name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "pydantic>=2.5" pytest
      - name: Run unit tests
        run: pytest -q tests
      - name: Run offline evaluation
        run: python run_eval.py eval --engine builtin --models strong,medium,weak
